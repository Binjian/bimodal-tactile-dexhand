[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bimodal-tactile-dexhand"
version = "0.1.0"
description = "Heterogeneous 6D Hall Array & Vision-Based Tactile (VBT) Sensing, Multi-Rate Sim2Real, Distributed Training, and 1000 Hz Slip-Admittance Control for Dexterous Hands"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dexterous Tactile Robotics Lab" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
gpu = [
    "warp-lang>=1.4.0",
    "mujoco>=3.2.0",
    "torch>=2.3.0",
]
notebooks = [
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bimodal_tactile"]

[tool.ruff]
line-length = 100
target-version = "py311"
